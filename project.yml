# XcodeGen spec — run `xcodegen generate` to produce Readr.xcodeproj.
# Requires macOS + Xcode 15+. The project is regenerated from this file, so the
# .xcodeproj is git-ignored (see .gitignore).
name: Readr

options:
  bundleIdPrefix: com.readrai
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  # `sources: - App` sweeps in App/PrivacyInfo.xcprivacy; make the privacy
  # manifest a bundled resource (not a compiled source) on every XcodeGen
  # version so the archive ships it (avoids the ITMS-91053 rejection).
  fileTypes:
    xcprivacy:
      buildPhase: resources
    # The bundled sample book (App/Resources/alice-in-wonderland.epub) is data,
    # not something to compile. Without this, `sources: - App` sweeps it into
    # Compile Sources on some XcodeGen versions and it never reaches the
    # bundle — where `SampleBookSeeder` expects to find it on first launch.
    epub:
      buildPhase: resources

packages:
  # The core logic lives in the local Swift package at the repo root.
  ReadrKit:
    path: .
  # EPUB reading: ZIPFoundation supplies the archive bytes; all EPUB parsing
  # lives in ReadrKit.EPUBBookParser.
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    exactVersion: "0.9.19"
  # "Readr Voice (Beta)": Kokoro-82M neural narration via FluidAudio's CoreML
  # port (Apache-2.0, espeak-free G2P) — see docs/ROADMAP.md M10. App-layer
  # only, behind ReadrKit's SpeechEngine protocol (KokoroSpeechEngine); the
  # ~104MB model downloads on first use, never bundled. Pinned exactly: the
  # narration path shouldn't move under us on a resolve.
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio
    exactVersion: "0.15.6"
  # Readr Voice on iPhone/iPad: the same Kokoro-82M, run on the Metal GPU via
  # MLX instead of CoreML — Apple's CoreML CPU path segfaults inside libBNNS
  # on iOS 26.4+ (FluidAudio#817/#844; three App Store crash logs), and MLX
  # never touches BNNS. Blaizzy/mlx-audio-swift (MIT) supplies the Kokoro
  # port and an espeak-free Misaki G2P (lexicon + a 3MB BART fallback on MLX,
  # assets from HF beshkenadze/kitten-tts-g2p, MIT); weights are
  # mlx-community/Kokoro-82M-bf16 (~327MB, Apache-2.0), downloaded on first
  # use, never bundled. See docs/research/MLX-KOKORO-IOS.md for the decision.
  # Pinned to a commit rather than a tag: v0.1.3 (2026-07-09) predates the
  # per-phoneme duration API, and the package's debug-only unsafeFlags are
  # only permitted by SwiftPM for revision/branch pins anyway. App-layer only
  # (MLXKokoroSpeechEngine), used at runtime on iOS devices only — the iOS
  # Simulator cannot run MLX at all (mlx#2605), so it compiles there and is
  # never entered (UI tests use UITestStubSpeechEngine).
  MLXAudio:
    url: https://github.com/Blaizzy/mlx-audio-swift
    revision: d20cbd660424c9f202363306ef4ff4595a199356
  # Declared explicitly so the MLX runtime is pinned too (mlx-audio-swift asks
  # for `from: 0.30.6`): ≥ 0.31.1 fixes an iOS ConvTransposed1d bug Kokoro's
  # decoder hits (mlx-swift#344); ≤ 0.31.4 because 0.31.5+ needs Swift tools
  # 6.3 (Xcode 26.4), and the CI/TestFlight runners top out at Xcode 26.3.
  # MIT. Its Metal shaders only compile under
  # xcodebuild, which is why none of this can live in the ReadrKit package.
  MLX:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: "0.31.4"
  # mlx-audio-swift's Hub client (Apache-2.0). Declared because the MLX
  # engine names its `Repo.ID` type directly — the weights are fetched to
  # disk in one step and loaded onto the GPU in a separate, foreground-only
  # one — and a type we compile against should be pinned, not inherited from
  # a transitive resolve. Satisfies the package's `from: 0.8.1`.
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface.git
    exactVersion: "0.10.0"
  # "Downloaded model": a language model Readr downloads and runs itself on
  # the same MLX runtime (App/LLM/MLXLLMProvider.swift), for iPhones that
  # can't run Apple's on-device model. Apple's mlx-swift-lm supplies the
  # architectures (Qwen3.5 among them), KV cache and ChatSession; it is
  # already in the graph through mlx-audio-swift (`from: 3.31.3`), declared
  # here so the version we compile against is pinned. 3.31.4 is the last tag
  # that resolves against mlx-swift 0.31.4 (main wants 0.31.6 / tools 6.2).
  # MIT. iOS only, like everything MLX here.
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm.git
    exactVersion: "3.31.4"
  # Tokenizers for the downloaded models' tokenizer.json files (Apache-2.0);
  # also already in the graph through mlx-audio-swift.
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers.git
    exactVersion: "1.3.4"
  # Readium's paginated navigator (reflow/fonts/decorations) is an optional
  # rendering upgrade tracked for a later milestone:
  # ReadiumNavigator:
  #   url: https://github.com/readium/swift-toolkit
  #   from: "3.0.0"

targets:
  Readr:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - App
    dependencies:
      - package: ReadrKit
        product: ReadrKit
      - package: ZIPFoundation
        product: ZIPFoundation
      - package: FluidAudio
        product: FluidAudio
      # MLX Kokoro is iOS-only: every use is behind `#if os(iOS)`
      # (App/Speech/MLXKokoroSpeechEngine.swift), and `platformFilter: iOS`
      # keeps the four products out of the macOS build altogether — so the
      # Mac app neither links MLX nor compiles mlx-swift's Metal shaders
      # (which need the separately-downloaded Metal toolchain on Xcode 26).
      # Verify after `xcodegen generate` with
      # `grep -c 'platformFilter = ios;' Readr.xcodeproj/project.pbxproj`.
      - package: MLXAudio
        product: MLXAudioTTS
        platformFilter: iOS
      - package: MLXAudio
        product: MLXAudioCore
        platformFilter: iOS
      - package: MLX
        product: MLX
        platformFilter: iOS
      - package: swift-huggingface
        product: HuggingFace
        platformFilter: iOS
      - package: mlx-swift-lm
        product: MLXLLM
        platformFilter: iOS
      - package: mlx-swift-lm
        product: MLXLMCommon
        platformFilter: iOS
      - package: swift-transformers
        product: Tokenizers
        platformFilter: iOS
    # Keys that GENERATE_INFOPLIST_FILE can't express land in this generated
    # plist (git-ignored; XcodeGen keeps it out of Copy Bundle Resources) and
    # Xcode merges both sources into the final Info.plist.
    info:
      path: App/Info.plist
      properties:
        # HTTPS-only networking qualifies for the exemption, so TestFlight
        # never asks the export-compliance question per build.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        # Read-aloud keeps playing with the screen locked or the app in the
        # background, like any audiobook — see App/Speech/AVSpeechEngine.swift,
        # which puts the session in .playback/.spokenAudio, and NarrationModel,
        # which publishes to the lock screen and takes remote commands.
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # All four orientations keep the iPad multitasking-capable
        # (UIRequiresFullScreen would opt out of Split View).
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Files-app / Finder registration: Readr shows up in "Open with" and
        # share sheets for exactly the formats the in-app importer accepts —
        # keep this list in lockstep with LibraryImport.types
        # (App/Views/Library/LibrarySupport.swift). LSHandlerRank is Alternate
        # throughout: Readr reads these system/standard UTIs but owns none of
        # them.
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB Publication
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - org.idpf.epub-container
          - CFBundleTypeName: PDF Document
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
          - CFBundleTypeName: Plain Text
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
          - CFBundleTypeName: Markdown Document
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - net.daringfireball.markdown
        # Open-in-place is safe: AppModel.importBook takes security-scoped
        # access and copies the file into the app's Books directory — the
        # original is never held open or mutated.
        LSSupportsOpeningDocumentsInPlace: true
        # Readr has its own library UI; it is not a document-browser app.
        UISupportsDocumentBrowser: false
    settings:
      base:
        # Must match the App ID registered in the Apple Developer portal.
        PRODUCT_BUNDLE_IDENTIFIER: com.readrai.app
        GENERATE_INFOPLIST_FILE: "YES"
        # Tracks the current shipping version. Both release lanes override this
        # from the tag they build, so shipped artifacts are unaffected — but a
        # local or CI build otherwise reported 0.1.0, which made crash and
        # feedback triage lie about which version a report came from. Bump this
        # with each release tag.
        MARKETING_VERSION: "3.3.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        # FluidAudio is Apple-silicon-only in practice: its NemoTextProcessing
        # binary ships arm64-only (simulator link failure) and its Swift uses
        # Float16, unavailable on x86_64 macOS (CI's generic/universal build
        # failure) — and the models it exists to run target the Neural Engine,
        # which Intel Macs don't have. So the app drops the x86_64 slice
        # everywhere: simulator builds and the macOS app are arm64-only from
        # the Readr Voice release on.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        "EXCLUDED_ARCHS[sdk=macosx*]": x86_64
        # iOS device builds only: the ~327MB MLX Kokoro weights plus MLX's
        # working buffers sit above the default jetsam limit on 4–6GB phones.
        # Increased Memory Limit needs no App ID capability, just the
        # entitlement (App/Readr.entitlements). Deliberately not applied to
        # macOS (no jetsam; an unknown entitlement is a notarization risk) or
        # the simulator (never runs MLX).
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": App/Readr.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Readr
        # App Store / Launchpad category (an ebook reader → Books).
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.books
        TARGETED_DEVICE_FAMILY: "1,2"
        # Cloud-managed signing: the TestFlight workflow passes
        # DEVELOPMENT_TEAM + an App Store Connect API key on the command line
        # (see .github/workflows/testflight.yml). The team ID deliberately
        # never lives in the repo; simulator builds need none, and device
        # builds pick a team in Xcode's Signing pane or via
        # `DEVELOPMENT_TEAM=... xcodebuild ...`.
        CODE_SIGN_STYLE: Automatic
        # App icon + accent live in App/Assets.xcassets.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  ReadrAppUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - UITests
    dependencies:
      - target: Readr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.readrai.uitests
        SWIFT_VERSION: "5.9"
        # The macOS UI-test runner is a real signed .app; without a generated
        # Info.plist codesign refuses it ("target does not have an Info.plist
        # file"), so the suite could never run on macOS. Harmless on iOS, where
        # the simulator run signs with CODE_SIGNING_ALLOWED=NO.
        GENERATE_INFOPLIST_FILE: "YES"

  # macOS-only visual coverage: app-hosted unit tests that render the key
  # SwiftUI surfaces offscreen and attach PNGs (published to ci-screenshots
  # with m-prefixed names). Deterministic — no XCUITest automation session.
  ReadrSnapshotTests:
    type: bundle.unit-test
    supportedDestinations: [macOS]
    sources:
      - SnapshotTests
    dependencies:
      - target: Readr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.readrai.snapshottests
        SWIFT_VERSION: "5.9"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Readr.app/Contents/MacOS/Readr"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Readr:
    build:
      targets:
        Readr: all
        ReadrAppUITests: [test]
    test:
      targets:
        - ReadrAppUITests

  # Separate scheme so the iOS simulator run never plans the macOS-only
  # snapshot bundle, and vice versa.
  ReadrSnapshots:
    build:
      targets:
        Readr: all
        ReadrSnapshotTests: [test]
    test:
      targets:
        - ReadrSnapshotTests
      # The host app reads the Keychain at launch (provider line in the
      # sidebar); an unsigned local build gets a "Readr wants to use your
      # confidential information" prompt that blocks the runner before
      # XCTest connects. In-memory credentials for the host, as the UI tests
      # already do — CI runners have no Keychain items either way.
      commandLineArguments:
        "-uiTestInMemoryCredentials": true
