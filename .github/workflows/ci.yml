name: CI

on:
  push:
    branches: [main]
  pull_request:

# contents: write lets the reader-app job push captured screenshots to the
# `ci-screenshots` branch.
permissions:
  contents: write

jobs:
  reader-kit:
    name: Build & test ReadrKit
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  reader-app:
    name: Build Readr app (iOS + macOS)
    # macOS 15 ships Xcode 16, which reads the project format XcodeGen emits.
    runs-on: macos-15
    env:
      # Simulator names drift across Xcode images; keep them in one place and
      # check `xcrun simctl list devicetypes` when a rename breaks the job.
      #
      # iPhone 17 Pro deliberately: it runs the iOS 26 runtime, which is the
      # SDK testflight.yml ships on. Until this changed, CI built with the
      # image's default Xcode 16.4 / iOS 18 SDK while TestFlight shipped an
      # Xcode 26 binary — so no job ever compiled or exercised the toolchain
      # users actually get. That gap hid a real bug: Return in PDF search did
      # nothing on the iOS 26 runtime and worked on iOS 18, so the iPhone 16
      # job stayed green through it.
      IPHONE_SIM: iPhone 17 Pro
      # The iPad rides the same (now iOS 26) toolchain for regular-width layout
      # coverage; it is the split-view/two-page canary, not an SDK one. M5, not
      # M4: Xcode 26 images pre-create the M5 instance, and an M4 destination
      # fails to resolve at all ("Unable to find a device matching the provided
      # destination specifier") even though the M4 device *type* still exists.
      IPAD_SIM: iPad Pro 13-inch (M5)
      # macOS XCUITest needs a REAL signature: the runner app is launched by
      # the system, which refuses the automation connection to an unsigned
      # bundle ("the test runner hung before establishing connection"). The
      # simulator has no such rule, which is why the iOS jobs run fine with
      # CODE_SIGNING_ALLOWED=NO. Absent the secret the macOS UI job skips
      # rather than fails, so forks and secret-less checkouts stay green.
      HAS_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      # Test the toolchain we SHIP. testflight.yml pins Xcode 26 because App
      # Store Connect rejects anything built against an older SDK; if CI stays
      # on the image default (16.4 / iOS 18) it validates a binary nobody
      # receives. Same selection logic as testflight.yml — fail loudly rather
      # than silently testing the wrong SDK.
      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app || true
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26.x on this runner image (see listing above) — move this job to a newer macos image."
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (macOS)
        run: >
          set -o pipefail &&
          xcodebuild build
          -project Readr.xcodeproj
          -scheme Readr
          -destination 'generic/platform=macOS'
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO
      # Device SDK, not simulator: catches iOS-device-only breakage (missing
      # frameworks, arch issues) on every PR instead of at TestFlight time.
      - name: Build (iOS device SDK)
        run: >
          set -o pipefail &&
          xcodebuild build
          -project Readr.xcodeproj
          -scheme Readr
          -destination 'generic/platform=iOS'
          -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO
      # Offscreen SwiftUI renders of the macOS-only surfaces (m-prefixed
      # PNGs). App-hosted unit tests, not XCUITest — deterministic on runners.
      - name: Snapshot tests (macOS)
        run: >
          set -o pipefail &&
          xcodebuild test
          -project Readr.xcodeproj
          -scheme ReadrSnapshots
          -destination 'platform=macOS'
          -skipPackagePluginValidation
          -resultBundlePath MacResults
          CODE_SIGNING_ALLOWED=NO
      - name: UI tests (iPhone Simulator)
        run: >
          set -o pipefail &&
          xcodebuild test
          -project Readr.xcodeproj
          -scheme Readr
          -destination "platform=iOS Simulator,name=${IPHONE_SIM}"
          -skipPackagePluginValidation
          -retry-tests-on-failure
          -test-iterations 3
          -resultBundlePath TestResults
          CODE_SIGNING_ALLOWED=NO
      # Same suite at iPad size: regular-width layouts (side-by-side split
      # view, double-page reader) take different code paths than the iPhone's
      # compact ones, so iPhone-green does not imply iPad-green.
      - name: UI tests (iPad Simulator)
        run: >
          set -o pipefail &&
          xcodebuild test
          -project Readr.xcodeproj
          -scheme Readr
          -destination "platform=iOS Simulator,name=${IPAD_SIM}"
          -skipPackagePluginValidation
          -retry-tests-on-failure
          -test-iterations 3
          -resultBundlePath IPadResults
          CODE_SIGNING_ALLOWED=NO
      # The Mac app's own XCUITest run. Snapshot tests render SwiftUI surfaces
      # offscreen and explicitly cannot reach real toolbar/window chrome, which
      # is where macOS-only regressions live: the reader shipped with NO
      # typeface, line-spacing or justification control because
      # testAppearanceOffersFontSpacingAndJustification asserted only the iOS
      # shape and ran only on simulators. This job is what closes that gap.
      - name: Import Developer ID certificate (macOS UI tests)
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign
          rm cert.p12
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
      #
      # SCOPED TO ONE TEST ON PURPOSE. A full macOS run is 21 failures / 2
      # skipped / 2 passed out of 25: the rest assume iOS shapes — swipe
      # gestures, the split-view idiom, tap-to-toggle chrome. A permanently red
      # job is worse than no job; it teaches everyone to ignore the signal.
      #
      # This is the ONLY test demonstrated green on a clean runner. Two others
      # (testEmptyLibraryCopyIsPlatformCorrect, testTOCJumpToChapterTwoUpdates-
      # Reader) pass on a developer Mac and FAIL here, because a dev machine
      # carries persisted UserDefaults — reading layout, theme — that a fresh
      # runner does not. Passing locally is not evidence for this list; only a
      # green CI run is.
      #
      # Growing the list also needs cross-test interference fixed: the test
      # below passes scoped but fails inside a full macOS run.
      - name: UI tests (macOS)
        if: env.HAS_SIGNING == 'true'
        run: |
          set -o pipefail
          IDENTITY=$(security find-identity -v -p codesigning build.keychain \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          echo "Signing UI test runner as: $IDENTITY"
          xcodebuild test \
            -project Readr.xcodeproj \
            -scheme Readr \
            -destination 'platform=macOS' \
            -only-testing:ReadrAppUITests/ReadrFlowUITests/testAppearanceOffersFontSpacingAndJustification \
            -skipPackagePluginValidation \
            -resultBundlePath MacUIResults \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IDENTITY"
      # -retry-tests-on-failure + -test-iterations 3: XCUITest on the
      # simulator is timing-sensitive and occasionally flakes (sheet/inspector
      # presentation races). Retrying a *failed* test up to twice rescues
      # intermittent flakes while a real regression still fails all three
      # attempts and reddens the build.
      - name: Extract screenshots
        if: always()
        run: |
          brew install chargepoint/xcparse/xcparse
          xcparse screenshots TestResults.xcresult shots || true
          xcparse screenshots IPadResults.xcresult shots/ipad || true
          xcparse attachments MacResults.xcresult shots --uti public.png || true
          ls -R shots || true
      - name: Publish screenshots
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -d shots ] && [ -n "$(ls -A shots 2>/dev/null)" ]; then
            cd shots
            git init -q -b ci-screenshots
            git config user.name "readr-ci" && git config user.email "ci@readr.local"
            git add -A && git commit -qm "screenshots for $GITHUB_SHA"
            git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
          fi
